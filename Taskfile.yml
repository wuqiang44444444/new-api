version: '3'

tasks:
  docs:check:
    desc: Check docs structure, directory READMEs, and required Chinese-named docs.
    cmds:
      - bash scripts/docs/check-docs.sh

  ai:check:
    desc: Check AI guide files reference the canonical guide.
    cmds:
      - bash scripts/docs/check-ai.sh

  docs:new-adr:
    desc: "Create a numbered ADR. Usage: task docs:new-adr title=决策标题"
    cmds:
      - test -n "{{.title}}"
      - bash scripts/docs/new-adr.sh "{{.title}}"
